<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#102b3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 58px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 25px 'Segoe UI', sans-serif; fill: #b7c8d6; }
      .node-title { font: 700 24px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .node-text { font: 400 18px 'Segoe UI', sans-serif; fill: #d7e3ea; }
      .small { font: 600 17px 'Segoe UI', sans-serif; fill: #8ee8dd; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1740" cy="140" r="250" fill="#164e63" opacity=".28"/>
  <circle cx="120" cy="1000" r="300" fill="#0f766e" opacity=".16"/>
  <text x="100" y="110" class="small">PROOF BEFORE PAY / SYSTEM MAP</text>
  <text x="100" y="180" class="title">Evidence first. Payment second.</text>
  <text x="100" y="225" class="subtitle">A human-controlled investigation pipeline for supplier payment exceptions.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="360" width="260" height="190" rx="18" fill="#153b4a" stroke="#4fd1c5" stroke-width="2"/>
    <text x="130" y="415" class="node-title">1. Evidence intake</text>
    <text x="130" y="460" class="node-text">Invoice</text>
    <text x="130" y="490" class="node-text">Purchase order</text>
    <text x="130" y="520" class="node-text">GRN / vendor / bank</text>

    <rect x="450" y="360" width="270" height="190" rx="18" fill="#163b55" stroke="#7dd3fc" stroke-width="2"/>
    <text x="480" y="415" class="node-title">2. Extract facts</text>
    <text x="480" y="460" class="node-text">LLM reads documents</text>
    <text x="480" y="490" class="node-text">Fields and line items</text>
    <text x="480" y="520" class="node-text">Evidence stays traceable</text>

    <rect x="810" y="330" width="300" height="250" rx="18" fill="#183d48" stroke="#4fd1c5" stroke-width="2"/>
    <text x="840" y="385" class="node-title">3. Verify deterministically</text>
    <text x="840" y="430" class="node-text">Math and totals</text>
    <text x="840" y="460" class="node-text">PO / GRN matching</text>
    <text x="840" y="490" class="node-text">Vendor and bank checks</text>
    <text x="840" y="520" class="node-text">Duplicate billing</text>
    <text x="840" y="550" class="node-text">Currency and tax rules</text>

    <rect x="1200" y="360" width="260" height="190" rx="18" fill="#45351b" stroke="#fbbf24" stroke-width="2"/>
    <text x="1230" y="415" class="node-title">4. Apply rules</text>
    <text x="1230" y="460" class="node-text">HOLD wins over</text>
    <text x="1230" y="490" class="node-text">INVESTIGATE, then PAY</text>
    <text x="1230" y="520" class="node-text">No silent approval</text>

    <rect x="1550" y="360" width="270" height="190" rx="18" fill="#3d2630" stroke="#fb7185" stroke-width="2"/>
    <text x="1580" y="415" class="node-title">5. Human decision</text>
    <text x="1580" y="460" class="node-text">PAY / HOLD /</text>
    <text x="1580" y="490" class="node-text">INVESTIGATE</text>
    <text x="1580" y="520" class="node-text">No payment execution</text>
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#arrow)">
    <path d="M360 455 H450"/>
    <path d="M720 455 H810"/>
    <path d="M1110 455 H1200"/>
    <path d="M1460 455 H1550"/>
  </g>

  <rect x="270" y="730" width="1380" height="170" rx="22" fill="#0d1d2b" stroke="#2d5262" stroke-width="2"/>
  <text x="320" y="790" class="node-title">Always-on safety boundary</text>
  <text x="320" y="835" class="node-text">AI reasons • deterministic tools calculate • schema validates • trace records every phase • human approves consequences</text>
  <text x="320" y="875" class="node-text">The system investigates payment risk. It never moves money or changes bank details.</text>

  <text x="100" y="1010" class="subtitle">Current implementation: Reviewer UI + AgentOrchestrator + public evidence cases + audit traces</text>
</svg>